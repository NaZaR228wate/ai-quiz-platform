services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_TITLE: AI Quiz Platform API
      DATABASE_URL: sqlite:////data/app.db
      JWT_SECRET_KEY: docker_development_secret_change_me
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      OPENAI_API_KEY: ""
      OPENAI_MODEL: gpt-4.1-mini
    volumes:
      - backend_data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  backend_data:
